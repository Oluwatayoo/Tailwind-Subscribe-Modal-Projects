<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Subscribe Modal 3</title>
  </head>
  <body>
    <div
      class="flex items-center justify-center min-h-screen bg-[#e5e5e5] w-full"
    >
      <div
        class="bg-gradient-to-b from-[#F4F6F9] to-white rounded-3xl mx-10 md:mx-auto w-[400px] sm:w-[62%] md:w-[800px] md:h-[340px]"
      >
        <div class="flex flex-col md:flex-row w-full md:h-full">
          <img
            src="diana-akhmetianova-s358rpxEALI-unsplash 1.png"
            alt=""
            class="h-72 w-full md:h-full rounded-t-3xl md:w-72 md:rounded-tr-none md:rounded-l-3xl"
          />
          <div class="p-7 md:pl-8 md:flex md:flex-col md:justify-center">
            <h1
              class="font-sans text-[#252B42] font-medium leading-[1.15] text-[40px] text-center md:text-left"
            >
              Business news delievered weekly.
            </h1>
            <p
              class="text-[#252B42] max-w-xs text-center my-4 leading-5 tracking-wide mx-auto md:mx-0 md:max-w-full md:text-left"
            >
              Stay up to date with the latest articles and business updates.
              You'll even get special recommendations weekly.
            </p>
            <div
              class="flex flex-col items-center md:flex-row space-y-4 md:space-y-0 md:w-full"
            >
              <input
                type="text"
                placeholder="Your Email"
                class="bg-[#f9f9f9] p-2.5 px-5 w-5/6 text-center md:text-left md:p-2 md:px-3 md:rounded-r-none md:w-full md:rounded-l-2xl md:w-64 rounded-2xl placeholder:text-[#737373] placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
              />
              <button
                class="bg-[#3525e6] text-xs w-5/6 rounded-2xl text-white p-3 px-5 md:p-3 md:px-5 md:w-1/4 text-center hover:bg-blue-600 md:rounded-l-none"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
