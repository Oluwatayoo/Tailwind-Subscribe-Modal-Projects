<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Subscribe Modal 5</title>
  </head>
  <body>
    <div
      class="flex items-center justify-center min-h-screen bg-[#e5e5e5] w-full"
    >
      <div
        class="bg-white rounded-3xl p-7 md:p-3.5 md:pr-5 w-[390px] sm:w-3/5 md:w-[750px] md:h-[340px] md:flex md:items-center"
      >
        <div class="flex flex-col md:flex-row md:gap-3.5 w-full">
          <img
            src="./images/family-bubble-5 1.png"
            alt="A bubble"
            class="w-full h-[300px] mb-5 md:mb-0"
          />
          <div class="md:self-center">
            <p
              class="font-semibold text-2xl mb-2 md:mb-3 text-left text-[#394452]"
            >
              You're probably thinking, “Another newsletter?” But we promise,
              you're going to love ours!
            </p>
            <p class="text-[#858585] text-base text-center md:text-left mb-4">
              Subscribe to our newsletter
            </p>
            <div
              class="flex flex-col items-center md:flex-row space-y-4 md:space-y-0 md:w-full"
            >
              <input
                type="text"
                placeholder="Your Email"
                class="bg-[#f9f9f9] p-2.5 px-5 w-5/6 text-center md:text-left md:p-2 md:px-3 md:rounded-r-none md:w-3/4 md:rounded-l-2xl md:w-64 rounded-2xl placeholder:text-[#737373] placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
              />
              <button
                class="bg-[#3525e6] text-xs w-5/6 rounded-2xl text-white p-3 px-5 md:p-3 md:px-5 md:w-1/4 text-center hover:bg-blue-600 md:rounded-l-none"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
