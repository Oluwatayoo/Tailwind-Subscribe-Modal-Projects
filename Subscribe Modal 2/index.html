<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Subscription Model</title>
  </head>
  <body>
    <div class="flex justify-center items-center min-h-screen bg-[#e5e5e5]">
      <div class="bg-white rounded-3xl p-3 mx-10 md:mx-auto">
        <div class="flex flex-col md:flex-row">
          <img
            src="./transistor-delivery 1.png"
            alt=""
            class="object-fit h-72 md:h-64 md:w-80"
          />
          <div class="p-4 md:p-0 md:my-auto">
            <h1
              class="font-sans text-[#858C94] text-5xl font-semibold text-center md:text-left italic"
            >
              It's called value
            </h1>
            <p
              class="text-[#858C94] text-base text-center max-w-xs md:max-w-lg mx-auto my-4 md:my-6 md:text-left"
            >
              Get the latest articles and business updates that you need to
              know, you'll even get special recommendations weekly.
            </p>
            <div
              class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:pr-10"
            >
              <input
                type="text"
                placeholder="Your Email"
                class="bg-[#f9f9f9] p-2.5 px-5 text-center md:text-left md:p-3 md:rounded-r-none md:w-full md:rounded-l-2xl md:w-64 rounded-2xl placeholder:text-[#737373] placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
              />
              <button
                class="bg-[#3525e6] text-xs rounded-2xl text-white p-3 px-5 md:p-3 md:px-5 text-center hover:bg-blue-600 md:rounded-l-none"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
