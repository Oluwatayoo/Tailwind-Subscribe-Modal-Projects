<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Subscribe Modal 6</title>
  </head>
  <body>
    <div
      class="flex items-center justify-center min-h-screen bg-[#e5e5e5] w-full"
    >
      <div
        class="bg-white rounded-3xl p-7 pt-14 md:p-3.5 md:pr-5 w-[390px] sm:w-3/5 md:w-[780px] md:h-[340px] md:flex md:items-center"
      >
        <div
          class="flex flex-col md:flex-row md:gap-6 w-full h-full md:items-center"
        >
          <img
            src="./images/dizzy-relaxed-time.png"
            alt="A lady relaxing"
            class="w-full md:h-48 md:w-[350px] md:mb-0 md:relative md:self-end right-4"
          />
          <div>
            <h1
              class="text-[#252B42] text-[64px] font-semibold text-center md:text-left"
            >
              Join Us!
            </h1>
            <p
              class="text-sm mb-5 md:mb-3 text-center md:text-left text-[#858C94]"
            >
              Subscribe to our weekly newsletter and be a part of our journey to
              self discovery and love.
            </p>
            <div
              class="flex flex-col items-center md:flex-row space-y-4 md:space-y-0 md:w-full"
            >
              <input
                type="text"
                placeholder="Your Email"
                class="bg-[#f9f9f9] p-2.5 px-5 w-5/6 text-center md:text-left md:p-2 md:px-3 md:rounded-r-none md:w-3/4 md:rounded-l-2xl md:w-64 rounded-2xl placeholder:text-[#737373] placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
              />
              <button
                class="bg-[#3525e6] text-xs w-5/6 rounded-2xl text-white p-3 px-5 md:p-3 md:px-5 md:w-1/4 text-center hover:bg-blue-600 md:rounded-l-none"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
