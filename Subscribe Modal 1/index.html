<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Subscribe Modal</title>
  </head>
  <body>
    <div class="flex justify-center items-center min-h-screen bg-[#e5e5e5]">
      <div class="bg-white p-4 mx-10 rounded-3xl md:mx-auto">
        <div class="flex flex-col md:flex-row">
          <img
            src="./images/dizzy-sending-messages 1.png"
            alt="A lady seated, with an ipad"
            class="object-fit h-80 w-96 md:h-72 md:w-96"
          />
          <div class="p-4 md:p-0 md:my-auto">
            <h1
              class="text-5xl font-semibold text-[#394452] font-sans text-center md:text-left"
            >
              Stay tuned!
            </h1>
            <p
              class="max-w-xs my-4 mx-auto text-center text-[#858C94] text-base font-normal md:text-left md:mx-0"
            >
              Get the latest articles and business updates that you need to
              know, you'll even get special recommendations weekly.
            </p>
            <div
              class="flex flex-col md:flex-row mt-4 space-y-4 md:space-y-0 md:pr-10"
            >
              <input
                type="text"
                placeholder="Your Email"
                class="bg-[#f9f9f9] p-4 px-5 text-center md:text-left md:p-3 md:rounded-r-none md:rounded-l-2xl md:w-64 rounded-2xl placeholder:text-[#737373] placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
              />
              <button
                class="bg-[#3525e6] text-xs rounded-2xl text-white p-4 px-5 md:p-3 md:w-auto text-center hover:bg-blue-600 md:rounded-l-none"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
